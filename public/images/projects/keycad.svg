<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">KeyCAD abstract project artwork</title>
  <desc id="desc">A playful CAD workspace with a geometric key, measurement nodes, dimensional guides, and floating shapes.</desc>
  <defs>
